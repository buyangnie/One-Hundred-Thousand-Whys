name: Publish course catalog
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-course-releases
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: pending
        name: Check course versions
        run: |
          pending=$(python3 scripts/release_courses.py --check)
          echo "publish=$pending" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.pending.outputs.publish == 'yes'
        with:
          python-version: '3.12'
      - name: Install film renderer dependencies
        if: steps.pending.outputs.publish == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fonts-dejavu-core
          python -m pip install Pillow==11.3.0 numpy==2.2.6
      - name: Render and publish new offline editions
        if: steps.pending.outputs.publish == 'yes'
        run: python scripts/release_courses.py --publish
  build:
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check course sources
        if: github.event_name == 'pull_request'
        run: python3 scripts/build.py --without-films
      - name: Build site with versioned films
        if: github.event_name != 'pull_request'
        run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
